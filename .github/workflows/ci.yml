name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:18
            env:
              POSTGRES_USER: metro_app
              POSTGRES_PASSWORD: ci-only-password
              POSTGRES_DB: metro_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U metro_app -d metro_test"
              --health-interval 5s
              --health-timeout 5s
              --health-retires 10
        env:
          TEST_DATABASE_URL: postgresql://metro_app:ci-only-password@localhost:5432/metro_test
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.2.0
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check .

            - name: Check formatting
              run: uv run ruff format --check .

            - name: Test
              run: uv run pytest