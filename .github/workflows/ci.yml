name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:18
            env:
              POSTGRES_USER: metro_app
              POSTGRES_PASSWORD: ci-only-password
              POSTGRES_DB: metro_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U metro_app -d metro_test"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10
        env:
          TEST_DATABASE_URL: postgresql://metro_app:ci-only-password@localhost:5432/metro_test
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.2.0
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check .

            - name: Check formatting
              run: uv run ruff format --check .

            - name: Test
              run: uv run pytest

    web:
        runs-on: ubuntu-latest
        defaults:
          run:
              working-directory: web
        steps:
          - uses: actions/checkout@v7

          - uses: actions/setup-node@v6
            with:
              node-version: 22
              cache: npm
              cache-dependency-path: web/package-lock.json

          - name: Install dependencies
            run: npm ci

          - name: Check formatting
            run: npm run format:check

          - name: Lint
            run: npm run lint

          - name: Test
            run: npm test

          - name: Build
            run: npm run build

    postgres-settings:
        runs-on: ubuntu-latest
        env:
          POSTGRES_PASSWORD: ci-only-password
        steps:
            - uses: actions/checkout@v7

            - name: Start Postgres with the server's settings
              run: docker compose up --wait --wait-timeout 60 postgres

            - name: Show the settings
              run: docker compose exec -T postgres psql -U metro_app -d metro -v ON_ERROR_STOP=1 -c "SHOW shared_buffers" -c "SHOW checkpoint_timeout" -c "SHOW max_wal_size" -c "SHOW wal_compression"