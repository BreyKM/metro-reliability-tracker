services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: metro_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: metro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    # Fewer, cheaper checkpoints and a bigger cache, for a write-heavy database (decision #33).
    command: >-
      postgres
      -c shared_buffers=2GB
      -c checkpoint_timeout=15min
      -c max_wal_size=4GB
      -c wal_compression=lz4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro_app -d metro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: